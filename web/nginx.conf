server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Shared by both proxied locations below. Note that nginx inherits
    # proxy_set_header into a location only when that location declares no
    # proxy_set_header of its own -- it is all-or-nothing, not a merge. If you
    # ever add a single header inside one of these locations, re-declare all
    # four of these there as well or they will silently disappear.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ =404;
    }

    # index.html fetches the relative path '/api/tasks', so every API call
    # arrives here first and is forwarded to the API container. The browser
    # only ever talks to this one origin and never learns the API's address,
    # which also means no CORS preflight and no rebuild when the API moves.
    #
    # No trailing slash on proxy_pass: that keeps the original URI intact, so
    # /api/tasks is forwarded as /api/tasks. Adding a slash would strip the
    # /api prefix and request /tasks, which the API does not serve.
    location /api/ {
        proxy_pass http://taskflow-api:4000;
    }

    # The API's health endpoint lives at /health, outside the /api/ prefix, so
    # without a rule of its own it would fall through to `location /` and 404
    # against the static root.
    #
    # `= /health` is an exact match: nginx tests exact matches first and stops
    # there, and unlike a prefix rule it will not also swallow /healthz or
    # /health/anything. Same bare proxy_pass as above, so the URI is forwarded
    # unchanged as /health.
    location = /health {
        proxy_pass http://taskflow-api:4000;
    }
}
