# Publish the two first-party TaskFlow images to GitHub Packages (GHCR).
#
# This workflow has no push trigger of its own on purpose. It is called:
#   * by ci.yml, on a green push to main, to publish the rolling `edge` tag
#   * by release.yml, on a tag, to publish the released semantic version
#   * by hand, from the Actions tab, via workflow_dispatch
#
# Authentication is the job's own GITHUB_TOKEN, so nothing has to be
# configured for this to work -- no secret, no personal access token.
#
# First run only: the package is created as private and owned by the account,
# not the repository. The org.opencontainers.image.source label set below
# links it back to this repository automatically; making it public is a
# one-time switch under Packages -> taskflow-api -> Package settings.

name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.0. Leave empty to publish as "edge".'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms.'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      latest:
        description: 'Also move the "latest" tag (semantic versions only).'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ''
      platforms:
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      latest:
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: 'The version string the images were tagged with.'
        value: ${{ jobs.publish.outputs.version }}

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      # Both matrix legs compute the same value, so whichever finishes last
      # wins and the result is the same either way.
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: taskflow-api
            context: api
            description: 'TaskFlow REST API. Express on Node 22, Alpine base, runs as an unprivileged user.'
          - image: taskflow-web
            context: web
            description: 'TaskFlow web tier. nginx serving the UI and reverse-proxying the API.'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        # Only needed when a non-native architecture is in the platform list;
        # installing it unconditionally is cheap and keeps the step simple.
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          WANT_LATEST: ${{ inputs.latest }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_DESCRIPTION: ${{ matrix.description }}
        run: |
          set -euo pipefail

          # GHCR rejects an upper-case path segment, and this repository's
          # owner is mixed case, so the whole name is folded down.
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/${IMAGE_NAME}"

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
              *)            version="edge" ;;
            esac
          fi

          tags=("${image}:${version}")
          if echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            # A stable release also gets the moving major and major.minor
            # tags. A pre-release (1.2.0-rc.1) deliberately gets neither,
            # and never moves "latest".
            tags+=("${image}:${version%.*}" "${image}:${version%%.*}")
            if [ "$WANT_LATEST" = "true" ]; then
              tags+=("${image}:latest")
            fi
          fi
          tags+=("${image}:sha-${GITHUB_SHA::7}")

          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags<<__TAGS__"
            printf '%s\n' "${tags[@]}"
            echo "__TAGS__"
            echo "labels<<__LABELS__"
            echo "org.opencontainers.image.title=${IMAGE_NAME}"
            echo "org.opencontainers.image.description=${IMAGE_DESCRIPTION}"
            echo "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.version=${version}"
            echo "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "__LABELS__"
          } >> "$GITHUB_OUTPUT"

          echo "Publishing ${image} as:"
          printf '  %s\n' "${tags[@]}"

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ghcr-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Summarise
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          {
            echo "### Published \`${IMAGE}:${VERSION}\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Registry | GitHub Packages (ghcr.io) |"
            echo "| Platforms | \`${PLATFORMS}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the published manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect both manifests
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          for name in taskflow-api taskflow-web; do
            echo "::group::ghcr.io/${owner}/${name}:${VERSION}"
            docker buildx imagetools inspect "ghcr.io/${owner}/${name}:${VERSION}"
            echo "::endgroup::"
          done
