# Scheduled dependency refresh for the API's npm dependencies.
#
# This is not a replacement for Dependabot (see .github/dependabot.yml), which
# reacts to published advisories and to individual releases. This workflow
# does the other half of the job: it rolls the lockfile forward on a schedule
# and opens one pull request for the result, so the lockfile never quietly
# drifts years behind the ranges in package.json.
#
# Two repository settings matter:
#
#   * Settings -> Actions -> General -> Workflow permissions ->
#     "Allow GitHub Actions to create and approve pull requests" must be on,
#     or the pull request cannot be opened.
#
#   * A push made with the default GITHUB_TOKEN does not start other
#     workflows, so CI will not run on the pull request this opens. To get CI
#     on it, add a fine-grained PAT with `contents: write` and
#     `pull_requests: write` as the repository secret
#     DEPENDENCY_UPDATES_TOKEN; it is picked up automatically below.

name: Dependency Updates

on:
  schedule:
    # 06:15 UTC every Tuesday, a day after Dependabot's Monday run, so the two
    # do not race to touch the same lockfile.
    - cron: '15 6 * * 2'
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Which update to attempt.'
        required: false
        type: choice
        default: in-range
        options:
          - in-range
          - latest
          - audit-fix
      dry-run:
        description: 'Report what would change without opening a pull request.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

env:
  BRANCH: chore/dependency-updates

jobs:
  update:
    name: Refresh api/package-lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history so the update branch can be rebased onto the default
          # branch rather than force-pushed from a shallow clone.
          fetch-depth: 0
          token: ${{ secrets.DEPENDENCY_UPDATES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Report what is currently outdated
        working-directory: api
        run: |
          set -uo pipefail
          echo "::group::npm outdated"
          # npm outdated exits 1 when anything is outdated, which is the
          # normal case here rather than a failure.
          outdated=$(npm outdated --long || true)
          echo "${outdated:-Everything is up to date.}"
          echo "::endgroup::"
          {
            echo "### Outdated packages before the update"
            echo
            echo '```'
            echo "${outdated:-Everything is up to date.}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the update
        id: update
        working-directory: api
        env:
          STRATEGY: ${{ inputs.strategy || 'in-range' }}
        run: |
          set -euo pipefail
          echo "strategy: ${STRATEGY}"

          case "$STRATEGY" in
            in-range)
              # Stays inside the semver ranges package.json already declares,
              # so only the lockfile moves. The safest of the three.
              npm update --save
              ;;
            latest)
              # Rewrites the ranges in package.json to the newest published
              # major. This one can break things, which is why it is opt-in.
              npx --yes npm-check-updates --upgrade
              npm install
              ;;
            audit-fix)
              npm audit fix
              ;;
            *)
              echo "::error::Unknown strategy '${STRATEGY}'."
              exit 1
              ;;
          esac

          # Prove the tree still installs and the server still parses before
          # asking anyone to look at the diff.
          npm ci
          node --check server.js
          echo "The updated lockfile installs cleanly and server.js parses."

      - name: Detect whether anything changed
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- api/package.json api/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes; nothing to open a pull request for."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Proposed change"
              echo
              echo '```diff'
              git diff --stat -- api/package.json api/package-lock.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATES_TOKEN || secrets.GITHUB_TOKEN }}
          STRATEGY: ${{ inputs.strategy || 'in-range' }}
          USING_PAT: ${{ secrets.DEPENDENCY_UPDATES_TOKEN != '' }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --force-create "$BRANCH"
          git add api/package.json api/package-lock.json
          git commit -m "chore(deps): refresh api dependencies (${STRATEGY})" \
                     -m "Opened automatically by .github/workflows/dependency-updates.yml."

          # Force push: this branch is disposable and is always rebuilt from
          # the current default branch, never appended to.
          git push --force origin "$BRANCH"

          ci_note="CI does **not** run on this pull request: it was pushed with the default \`GITHUB_TOKEN\`, and pushes made with that token do not start workflows. Add a \`DEPENDENCY_UPDATES_TOKEN\` secret to change that, or push an empty commit to this branch."
          if [ "$USING_PAT" = "true" ]; then
            ci_note="CI runs on this pull request normally."
          fi

          body=$(cat <<BODY
          Automated dependency refresh (\`${STRATEGY}\`).

          The updated lockfile was verified before this was opened:

          - \`npm ci\` installs cleanly from it
          - \`node --check server.js\` passes

          ${ci_note}

          ---
          Opened by [\`dependency-updates.yml\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/.github/workflows/dependency-updates.yml).
          BODY
          )

          # gh pr create fails outright if a label it is given does not
          # exist, so make sure it does. --force makes this idempotent.
          gh label create "dependencies" \
            --color "0366D6" \
            --description "Dependency updates" \
            --force || true

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(deps): refresh api dependencies (${STRATEGY})" --body "$body"
            echo "Updated existing pull request #${existing}."
            echo "Updated [#${existing}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${existing})." >> "$GITHUB_STEP_SUMMARY"
          else
            url=$(gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$BRANCH" \
              --title "chore(deps): refresh api dependencies (${STRATEGY})" \
              --body "$body" \
              --label "dependencies")
            echo "Opened ${url}"
            echo "Opened ${url}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report a dry run
        if: steps.diff.outputs.changed == 'true' && inputs.dry-run == true
        run: |
          set -euo pipefail
          echo "Dry run: changes were produced but no pull request was opened."
          echo "Dry run -- no pull request was opened." >> "$GITHUB_STEP_SUMMARY"
