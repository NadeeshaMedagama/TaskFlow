# Credentials.
#
# A Secret is NOT encryption. By default it is base64 in etcd, which is
# encoding, not protection -- anyone who can read Secrets in this namespace
# can read the password. What it does buy you is separation: it can be RBAC'd
# apart from the ConfigMap, kept out of `kubectl describe` output, and swapped
# without touching any other manifest.
#
# `stringData` is used rather than `data` so the values are written in plain
# text here and base64-encoded by the API server on the way in. Easier to read,
# identical result.
#
# ---------------------------------------------------------------------------
# The value below is the same throwaway default as .env.example. It is fine for
# a local kind/minikube cluster and fine for nothing else. For anything real,
# do not commit this file at all -- create the Secret imperatively instead:
#
#   kubectl create secret generic taskflow-secrets \
#     --namespace taskflow \
#     --from-literal=DB_USER=taskflow \
#     --from-literal=DB_PASSWORD="$(openssl rand -base64 24)"
#
# and delete this manifest. The Deployments reference the Secret by name, so
# they do not care how it got there.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/part-of: taskflow
type: Opaque
stringData:
  DB_USER: taskflow
  DB_PASSWORD: changeme
