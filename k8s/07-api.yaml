# ---------------------------------------------------------------------------
# taskflow-api  --  the Express API
#
# The service that shows what Compose could not do. Two replicas rather than
# one, a rolling update strategy that never drops below full capacity, and an
# anti-affinity rule that spreads the replicas across nodes. None of the three
# has a Compose equivalent.
#
# The image is the SAME artifact Phase 1 built and pushed. Nothing was rebuilt
# for Kubernetes -- that is the point of the exercise.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/instance: taskflow
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/version: "1.0.0"
spec:
  # Two, so that losing one is survivable. This is the self-healing demo:
  # `kubectl delete pod` one of them and the ReplicaSet replaces it while the
  # other keeps serving. Under Compose, `restart: unless-stopped` could only
  # restart the one container you had, after the outage.
  #
  # If you enable the HorizontalPodAutoscaler in 10-hpa.yaml, DELETE this
  # field. Two controllers both writing .spec.replicas fight: the HPA scales
  # to 5, the next `kubectl apply` puts it back to 2, the HPA scales up again.
  replicas: 2
  revisionHistoryLimit: 5
  # How long a rollout may make no progress before it is marked failed.
  progressDeadlineSeconds: 300
  # A new pod must stay Ready this long before it counts toward the rollout.
  # Without it, a pod that passes one probe and then crashes still lets the
  # rollout advance and take down the next old pod.
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-api
      app.kubernetes.io/instance: taskflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 is the important half. It means "never go below the
      # declared replica count" -- a new pod must be Ready before an old one
      # is removed, so a deploy costs zero capacity. maxSurge: 1 is what pays
      # for that: one extra pod may exist during the roll.
      #
      # Combined with readinessProbe below, this is a genuinely zero-downtime
      # deploy. `docker compose up -d` cannot do it: it stops the container,
      # then starts the new one.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-api
        app.kubernetes.io/instance: taskflow
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          # PREFERRED, not required. On a single-node kind cluster a required
          # rule would leave the second replica permanently Pending, since
          # there is no second node to put it on. Preferred spreads them when
          # the cluster can and shrugs when it cannot -- so the same manifest
          # works on a laptop and on a real cluster.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: taskflow-api
                    app.kubernetes.io/instance: taskflow
      # This is the translation of Compose's
      #     depends_on: { taskflow-db: { condition: service_healthy } }
      #
      # Kubernetes has no depends_on, and on purpose: a pod is expected to
      # tolerate its dependencies being absent and be restarted until they are
      # not. These init containers make startup orderly anyway, because they
      # are cheap and they turn a confusing CrashLoopBackOff into a clear
      # "Init:0/2" status.
      #
      # `nc -z` against the SERVICE address is a real readiness check, not just
      # a DNS check: kube-proxy only programs routes for endpoints whose pods
      # pass their readinessProbe, so a connection succeeds only once the
      # database is genuinely accepting queries.
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z taskflow-db 5432; do
                echo "waiting for taskflow-db:5432 ..."
                sleep 2
              done
              echo "taskflow-db is accepting connections"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: wait-for-cache
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z taskflow-cache 6379; do
                echo "waiting for taskflow-cache:6379 ..."
                sleep 2
              done
              echo "taskflow-cache is accepting connections"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          # The Phase 1 image, unmodified. Change the tag here to roll forward;
          # that single edit plus `kubectl apply` IS the rolling update.
          image: nadeeshamedagama/taskflow-api:1.0.0
          # IfNotPresent so a locally built image loaded with
          # `kind load docker-image` / `minikube image load` is used as-is
          # instead of being pulled over the top of it. With `Always` a local
          # image you had just built would be silently replaced by the
          # registry's.
          imagePullPolicy: IfNotPresent
          # The whole environment, from the two objects that hold it. This
          # replaces Compose's `env_file: .env` -- same flat environment
          # inside the container, but now half of it can be RBAC'd separately
          # and rotated without a rebuild.
          envFrom:
            - configMapRef:
                name: taskflow-config
            - secretRef:
                name: taskflow-secrets
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          # httpGet, not exec. The kubelet makes this request from outside the
          # container, so the image still needs no curl and no wget -- the
          # probe costs the image nothing, which is exactly why Phase 1's
          # Dockerfile could get away with shipping neither.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          lifecycle:
            preStop:
              # Endpoint removal and SIGTERM are dispatched concurrently, so
              # for a moment kube-proxy can still send a request to a pod that
              # is already shutting down. Sleeping here holds the container
              # open long enough for every node to see the endpoint go away
              # first. It is the standard fix for the handful of 502s that
              # otherwise appear during a rollout.
              #
              # Note also: node is PID 1 in this image and PID 1 ignores
              # signals it has no handler for, which is why Compose set
              # `init: true`. There is no Compose-style init here, so the
              # container is SIGKILLed at the end of the grace period rather
              # than exiting cleanly. Harmless for a stateless API; the real
              # fix is a process.on('SIGTERM') handler in server.js.
              exec:
                command: ["sleep", "5"]
          # From docker-compose.yml, unchanged.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            # The image already runs as the unprivileged `node` user (uid
            # 1000). Declaring it here means the kubelet REFUSES to start the
            # pod if that ever stops being true, which turns a Dockerfile
            # regression into a failed deploy instead of a silent one.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/instance: taskflow
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taskflow
spec:
  # ClusterIP again: the browser never talks to the API directly, it goes
  # through nginx, exactly as in Phase 1. This Service is also the load
  # balancer across the two replicas -- something Compose had no answer for.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/instance: taskflow
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
