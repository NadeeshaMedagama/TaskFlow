# ---------------------------------------------------------------------------
# taskflow-web  --  nginx serving the page and proxying the API
#
# The Phase 1 image again, unmodified -- including the nginx.conf baked into
# it, which proxies /api/ to http://taskflow-api:4000. That upstream name
# still resolves, because a Kubernetes Service in the same namespace answers
# to exactly the same short name a Compose service did. This is the single
# clearest illustration of why Phase 1 used service names instead of IPs.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-web
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-web
    app.kubernetes.io/instance: taskflow
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: taskflow
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: taskflow-web
      app.kubernetes.io/instance: taskflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taskflow-web
        app.kubernetes.io/instance: taskflow
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: taskflow
        app.kubernetes.io/version: "1.0.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: taskflow-web
                    app.kubernetes.io/instance: taskflow
      # This one is not a nicety, it is load-bearing.
      #
      # nginx resolves the names in `proxy_pass` ONCE, at startup, and refuses
      # to start at all with "host not found in upstream taskflow-api" if the
      # name does not resolve. Compose handled that with
      # `depends_on: condition: service_healthy`. Without this init container
      # the web pods would CrashLoopBackOff until the API Service existed --
      # they would recover eventually, which is self-healing working as
      # designed, but the failure reads like a real bug.
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z taskflow-api 4000; do
                echo "waiting for taskflow-api:4000 ..."
                sleep 2
              done
              echo "taskflow-api is accepting connections"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: nginx
          image: nadeeshamedagama/taskflow-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          lifecycle:
            preStop:
              # nginx handles SIGQUIT as "finish what you are serving, then
              # stop" and SIGTERM as "stop now". Kubernetes only ever sends
              # SIGTERM, so the graceful variant has to be asked for here.
              exec:
                command: ["/bin/sh", "-c", "sleep 5 && nginx -s quit"]
          # From docker-compose.yml, unchanged.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            # No runAsNonRoot here, unlike the API. The stock nginx image
            # starts its master process as root so it can bind port 80 -- a
            # privileged port -- and only then drops its workers to the nginx
            # user. Forcing non-root would need an image that listens above
            # 1024, which would mean rebuilding the Phase 1 artifact.
            capabilities:
              # NET_BIND_SERVICE is for binding port 80. The other four are
              # for the privilege drop itself: the master process starts as
              # root and spawns its workers as the `nginx` user, which is a
              # setuid/setgid call, and it chowns its cache directories on the
              # way. Drop ALL without these and nginx exits with
              # "setgid(101) failed (1: Operation not permitted)".
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE", "CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-web
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-web
    app.kubernetes.io/instance: taskflow
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: taskflow
spec:
  # Still ClusterIP. Compose published 8080:80 straight to the host; here the
  # Ingress in 09-ingress.yaml is the single documented way in, which is what
  # a real cluster looks like. `kubectl port-forward` covers you if you would
  # rather not install an ingress controller -- see the README.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taskflow-web
    app.kubernetes.io/instance: taskflow
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
